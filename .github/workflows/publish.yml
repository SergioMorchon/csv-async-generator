name: publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: npm publish
